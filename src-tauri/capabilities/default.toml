"$schema" = "../gen/schemas/desktop-schema.json"
identifier = "default"
description = "enables the default permissions"
windows = ["main"]

[[permissions]]
identifier = "core:default"
[[permissions]]
identifier = "os:default"
[[permissions]]
identifier = "os:allow-os-type"
[[permissions]]
identifier = "core:window:default"
[[permissions]]
identifier = "core:window:allow-start-dragging"
[[permissions]]
identifier = "core:window:allow-toggle-maximize"
[[permissions]]
identifier = "core:window:allow-minimize"
[[permissions]]
identifier = "core:window:allow-show"
[[permissions]]
identifier = "core:window:allow-close"
[[permissions]]
identifier = "core:window:allow-set-focus"
[[permissions]]
identifier = "core:window:allow-maximize"
[[permissions]]
identifier = "core:window:allow-unmaximize"
[[permissions]]
identifier = "core:window:allow-set-effects"
[[permissions]]
identifier = "decorum:allow-show-snap-overlay"
[[permissions]]
identifier = "shell:allow-open"

[[permissions]]
identifier = "shell:allow-execute"

[[permissions]]
identifier = "updater:default"

[[permissions]]
identifier = "log:default"

[[permissions]]
identifier = "dialog:default"

[[permissions]]
identifier = "fs:default"

[[permissions]]
identifier = "fs:allow-read-file"
	allow = [{ path = "**" }]

	[[permissions]]
	identifier = "fs:allow-write-file"
	allow = [{ path = "**" }]

	[[permissions]]
	identifier = "fs:allow-read-text-file"
	allow = [{ path = "**" }]

	[[permissions]]
	identifier = "fs:allow-write-text-file"
	allow = [{ path = "**" }]

	[[permissions]]
	identifier = "fs:allow-read-dir"
	allow = [{ path = "**" }]

	[[permissions]]
	identifier = "fs:allow-mkdir"
	allow = [{ path = "**" }]

	[[permissions]]
	identifier = "fs:allow-exists"
	allow = [{ path = "**" }]

	[[permissions]]
	identifier = "fs:allow-copy-file"
	allow = [{ path = "**" }]

	[[permissions]]
	identifier = "fs:allow-remove"
	allow = [{ path = "**" }]
